version: '3.9'

services:

  backend:
    build:
      context: ./backend
    container_name: visioninspect-backend
    ports:
      - "${BACKEND_PORT}:8000"
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 5
    
    volumes:
      - model_cache:/root/.cache


  frontend:
    build:
      context: ./frontend
    container_name: visioninspect-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped


volumes:  
  model_cache: